          path: ${{ env.LOG_HOST_PATH }}
          retention-days: 14

  # ───────────────────── ft-upfront phase 2 (ft 0.67 / 0.99) ────────────────
  ft-upfront-p2:
    name: ft-upfront phase 2 — ft0.67/0.99
