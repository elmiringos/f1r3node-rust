          docker save "${{ inputs.image }}" | k3s ctr images import -

      - name: Import testbed image into k3s
        working-directory: testbed
        run: make docker

      - name: Apply RBAC
        working-directory: testbed
        run: make job-setup

      - name: Run suite
        working-directory: testbed
        run: |
          source .env
          make job-run ENV=.env SUITE=ft-upfront-p2 \
